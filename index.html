<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Priority Pass — MTG Stack Trainer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Priority Pass</h1>
    <p class="tagline">Train the stack. Earn priority.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Mode">
    <button class="tab-btn active" data-tab="practice" role="tab" aria-selected="true">Practice</button>
    <button class="tab-btn" data-tab="daily" role="tab" aria-selected="false">Daily Puzzle</button>
    <button class="tab-btn" data-tab="log" role="tab" aria-selected="false">Log</button>
  </nav>

  <main id="view-root" class="app-main">
    <div class="loading">Loading puzzle bank…</div>
  </main>

  <footer class="app-footer">
    <span id="puzzle-count"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
